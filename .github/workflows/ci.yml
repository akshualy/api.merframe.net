name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: merframe
          POSTGRES_PASSWORD: merframe
          POSTGRES_DB: merframe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U merframe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://merframe:merframe@localhost:5432/merframe_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: make generate && git diff --exit-code
      - run: make test
      - run: make vuln
      - run: docker build -f deploy/Dockerfile .
