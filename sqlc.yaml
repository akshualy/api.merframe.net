version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/postgres/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
overrides:
  go:
    overrides:
      - db_type: "timestamptz"
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "date"
        go_type: "time.Time"
      - db_type: "pg_catalog.int4"
        go_type: "int"
      - db_type: "pg_catalog.int4"
        nullable: true
        go_type:
          type: "int"
          pointer: true
